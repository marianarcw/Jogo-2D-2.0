<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Água e Fogo</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="menu">
        <h1>🔥 Água e Fogo 💧</h1>

        <button id="startBtn">Jogar</button>

        <div id="info">

            <h2>Controles</h2>

            <div class="playerInfo">

                <h3>🔥 Fogo</h3>

                <p>A = Esquerda</p>
                <p>D = Direita</p>
                <p>W = Pular</p>

            </div>

            <div class="playerInfo">

                <h3>💧 Água</h3>

                <p>← = Esquerda</p>
                <p>→ = Direita</p>
                <p>↑ = Pular</p>

            </div>

        </div>

    </div>

    <canvas id="game" width="1000" height="600"></canvas>

    <script src="script.js"></script>

</body>
</html>
